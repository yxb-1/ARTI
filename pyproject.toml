[project]
name = "arti-prediction-markets"
version = "0.1.0"
description = "Read-only prediction market monitoring and evidence-based assessments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.10,<4",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
]

[project.scripts]
arti = "arti.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arti"]

[tool.hatch.build.targets.wheel.force-include]
"PROMPTS.md" = "arti/PROMPTS.md"
"config.example.json" = "arti/config.example.json"

[dependency-groups]
dev = ["pytest>=8,<10"]
